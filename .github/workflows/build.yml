name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }}

      - name: Build
        run: cmake --build build --config Release

      - name: Stage plugin folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/ColumnReplace | Out-Null
          Copy-Item build/Release/ColumnReplace.dll dist/ColumnReplace/
          Copy-Item README.md dist/ColumnReplace/

      - uses: actions/upload-artifact@v4
        with:
          name: ColumnReplace-${{ matrix.arch }}
          path: dist/ColumnReplace
